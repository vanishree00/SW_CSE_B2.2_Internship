<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML form 3 </title>
</head>
<body>
    <form action="" method="post">
        <fieldset>
            <legend>Personal information</legend>
            <p>
                
                <input type="text" name="fullName" id="fullName" placeholder="Enter full name*" required minlength="3" maxlength="10">
                <br>
                 <input type="email" name="email" id="email" placeholder="Enter Email*" required>
                <br>
                <input type="password" name="password" id="password" placeholder="Enter password*" required minlength="3" maxlength="8">
                <br>
                <input type="number" name="number" id="number" min="1" max="100" placeholder="Enter age" required>
                <br>
                <input type="tel" name="phone" id="phone" 
                pattern="[0-9]{10}"
                title="Enter contact number" required
                placeholder="Mobile number*"
                
                >    
            </p>
            <p><input type="date" id="dob" min="1990-01-01" max="2010-01-01">
            </p>
        </fieldset>

        <fieldset>
            <p>Gender:</p>
            <legend>Preferances</legend>
            <p>
                <input type="radio" name="gender" id="male" value="male">
                <label for="male">Male</label>
                <input type="radio" name="gender" id="female" value="female">
                <label for="female">Female</label>
                
            </p>
            <p>Skills:</p>
            <p>
                <input type="checkbox" name="skills" id="html" value="html">
                <label for="html">html</label>
                <input type="checkbox" name="skills" id="css" value="css">
                <label for="css">css</label>
                <input type="checkbox" name="skills" id="Javascript" value="Javascript">
                <label for="Javascript">Javascript</label>
                <input type="checkbox" name="skills" id="ReactJS" value="ReactJS">
                <label for="ReactJS">ReactJS</label>
            </p>
            <p>
                <label for="country">Country:</label><br>
                
                <select name="country" id="country">
                    <option value="">Select your country</option>
                    <option value="india">India</option>
                    <option value="germany">Germany</option>
                    <option value="france">France</option>
                </select>
            </p>
            <p>
                <label for="message">Message:</label><br>
                <textarea name="message" id="message" row="4" cols="30"></textarea>
            </p>
         </fieldset>

         <p>
            <input type="submit" value="Submit">
            <input type="reset" value="Reset">
         </p>
        </fieldset>
    </form>

    <form action="" novalidate>

        <p>HTML5 validation is turned off in this form</p>
        <input type="text" name="name" id="name" placeholder="Enter name">
        <button type="submit">Submit</button>
    </form>
</body>
</html>
