<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS colors</title>
    <style>
        .named{
            color: burlywood;
        }
        .hex{
            color: #ec596d
        }
        .rgb{
            color: rgb(228, 228, 10,1);
        }
        .hsl{
            color: hsla(128,100%,50%, 0.6);
        }
        .gradient{
            background-image: linear-gradient(135deg,green , orange);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            display: inline-block;

        }
    </style>
</head>
<body>
    <p>CSS colors</p>
    <ol>
        <li class="named">Named color</li>
        <li class="hex">HEX color</li>
        <li class="rgb">RGB & RGBA color</li>
        <li class="hsl">HSL & HSLA color</li>
        <li class="gradient">Gradient color</li>

    </ol>
</body>
</html>
