<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Badge – Variables + Animation</title>
<style>
  :root {
    --bg: #0b1020;
    --badge-bg: #22c55e;
    --badge-glow: rgba(34, 197, 94, 0.6);
    --text: #e2e8f0;
    --dur: 1.2s;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, sans-serif;
  }

  .badge {
    padding: 8px 14px;
    background: var(--badge-bg);
    color: #052e16;
    border-radius: 999px;
    font-weight: 600;
    font-size: 0.85rem;
    animation: pulse var(--dur) ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% {
      transform: scale(1);
      box-shadow: 0 0 0 0 var(--badge-glow);
    }
    50% {
      transform: scale(1.08);
      box-shadow: 0 0 0 10px transparent;
    }
  }
</style>
</head>
<body>
    <p>Normal text</p>
  <div class="badge">Live</div>
</body>
</html>
