<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS transform</title>
    <style>
        .box{
            transform: translateX(50px);
            background-color: burlywood;
            border: 2px solid black;
        }
        .box1{
            transform: translateY(20px);
            background-color: rgb(133, 147, 211);
            border: 2px solid black;
        }
        .box2{
            transform: translate(60px 50px);
            background-color: rgb(133, 211, 143);
            border: 2px solid black;
        }
        .box3{
            transform: rotateZ(180deg);
            background-color: rgb(225, 107, 186);
            border: 2px solid black;
        }

    </style>
</head>
<body>
    <p>CSS transfor: property visually moves, rotate, enlarge, shrink . it 2d or 3d</p>
    <div class="box">
        Hello, we are learning CSS Transform
    </div>
    <div class="box2">
        Box 2
    </div>

    <div class="box1">
        Box 1
    </div>
<br>
    <div class="box3">
        Box 3
    </div>

    <!-- translateX, translateY, translate | rotate(+/-) rotateX -->

</body>
</html>
