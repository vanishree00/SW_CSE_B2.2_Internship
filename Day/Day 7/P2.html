<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS transform: translate | rotate | scale | skew</title>
    <style>
        .box{
            transform: translateX(50px);
            background-color: burlywood;
            border: 2px solid black;
    
        }
        .box1{
            transform: translateY(20px);
            background-color: rgb(133, 147, 211);
            border: 2px solid black;
        }
        .box2{
            transform: translate(60px 50px);
            background-color: rgb(133, 211, 143);
            border: 2px solid black;
        }
        .box3{
            transform: rotateZ(180deg);
            background-color: rgb(225, 107, 186);
            border: 2px solid black;
        }

        .box4{
            margin-left: 40px;
            transform: scale3d(1.2, 1.4, 1);
            width: 100px;
            height: 100px;
            background-color: aqua;
            border: 3px solid black;
            margin-top: 40px;

        }

        .box5{
            width: 100px;
            height: 100px;
            margin-top: 50px;
            background-color: rgb(207, 129, 28);
            /* Skew: slant an element along one or both axes 
                skew(x,y) | skewX() | skewY()
            */
            transform: skew(5deg, 10deg);
        }


    </style>
</head>
<body>
    <p>CSS transfor: property visually moves, rotate, enlarge, shrink . it 2d or 3d</p>
    <div class="box">
        Hello, we are learning CSS Transform
    </div>
    <div class="box2">
        Box 2
    </div>

    <div class="box1">
        Box 1
    </div>
<br>
    <div class="box3">
        Box 3
    </div>

    <!-- translateX, translateY, translate | rotate(+/-) rotateX -->
    
    <div class="box4">
        Box 4
    </div>

    <div class="box5">
        box 5
    </div>
</body>
</html>
