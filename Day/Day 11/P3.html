<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Removing and Replacing th elements</title>
</head>
<body>
    <ul id="list">
        <li id="item1" class="item">Item 1 - to be deleted</li>
        <li id="item2" class="item">Item 2</li>
        <li id="old">Item 3 - to be replaced</li>
        <li id="item4" class="item">Item 4</li>
    </ul>
    <button onclick="removeElement()">Remove Item : remove()</button>
    <button onclick="removeChildElement()">Remove Item : removeChild()</button>
    <button onclick="replaceElement()">Replace Item </button>

    <script>
        function removeElement(){
            const item = document.querySelector("#item1");
            item.remove();
        }

        function removeChildElement(){
            const parent = document.querySelector("#list");
            const child = document.querySelector("#item2");
            parent.removeChild(child);
        }

        function replaceElement(){
            const parent = document.querySelector("#list");
            const oldItem = document.querySelector("#old");
            const newItem = document.createElement("li");
            newItem.textContent = "New Item";
            parent.replaceChild(newItem,oldItem);
        }
    </script>
</body>
</html>
