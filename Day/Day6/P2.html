<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model</title>
    <style>
        .box{
            width: 200px;
            height: 100px;
            background-color: cadetblue;
            /* top - right - bottom - left | top-bottom_left-right*/
            padding: 30px 20px; 
            padding: 20px;  /* shorthand representation */
            /* padding-left: 50px; */

            /* Border */
            /* shorthand representation */
            /* border: 2px solid blue;  */
            /* Line display style: solid/dashed/dotted */
            border-left: 1px dotted red;

            /* Margin : shorthand*/
            margin: 20px;
            /*   margin individual */
            margin-top: 10px;
            margin-right: 20px;
            margin-bottom: 12px;
            margin-left: 500px ;
        }
    </style>
</head>
<body>
    <div class="box"> 
        Content Text is being rendered here as an example for Box Model.Content Text is being rendered here as an example for Box Model
    </div>
</body>
</html>
