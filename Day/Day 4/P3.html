<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>div and span</title>
    <style>
        .card{
            background-color: pink;
        }
        .heighlight{
            background-color: blueviolet;
        }
    </style>

</head>
<body>
    <p>Div tag is: block level element</p>
    <p>span tag: inline level element</p>
    <div class="card">
        <h2>Product card</h2>
        <p>the product is beautiful and the best part of is its <span class="heighlight"> on scale</span></p>
    </div>
</body>
</html>
