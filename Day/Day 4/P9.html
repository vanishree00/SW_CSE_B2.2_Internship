<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class selector</title>
    <style>
        .style1{
            color: brown;
        }
        .style2{
            background-color: aquamarine;

            color: black;

        }
        .style3{
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold ;
        }
    </style>
</head>
<body>
    <h1 class="style1">Class selector</h1>
    <h1 class="style2">heading itself; but a different style</h1>
    <p class="style3">This is a new paragraph i have created</p>
    <p class="style2">This is the second paragraph</p>
</body>
</html>
