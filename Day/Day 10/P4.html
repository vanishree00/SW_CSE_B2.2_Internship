<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading and changing content</title>
</head>
<body>
    <!-- textContent -->
    <p id ="tc">textContent</p>
    <!-- innerText -->
    <p id ="it">innerText</p>
    <!-- innerHTML -->
    <p id ="ih">innerHTML</p>

    <script>
        // textContent: used when working with the plain text; does not 
        // consider the tag as html tag
        const tce = document.getElementById("tc");
        console.log(tce.textContent); //textContent
        tce.textContent = "textContent changed via JS; example";

        // innerText: When we want to work with visible text on the page. 
        const ite = document.getElementById("it");
        console.log(ite.innerText); //innerText
        ite.innerText = "innerText changed via JS; example";

        // innerHTML: read or set HTML inside an element
        const ihe = document.getElementById("ih");
        console.log(ihe.innerHTML); //innerHTML
        ihe.innerHTML = "<strong><i>innerHTML</i> changed via JS; example</strong>";
    </script>
</body>
</html>
