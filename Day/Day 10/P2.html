<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Structure understanding</title>
</head>
<body>
    <H3>DOM Structure understanding</H3>
    <p>This is an example html page to explore DOM.</p>
    <a href="https://bioub.github.io/dom-visualizer/">DOM Visualizer</a>
    <script>
        console.log(document); // the entire document
        console.log(document.body); // the <body> element
        console.log(document.head); // the <head> element
        console.log(document.title); // page title
    </script>
</body>
</html>
