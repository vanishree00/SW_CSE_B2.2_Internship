<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unorderd List</title>
</head>
<body>
    <p>Unorderd list: list and group related items for better readability</p>
    <ul>
        <li>Apple</li>
        <li>Banana</li>
        <li>Orange</li>
    </ul>
    <p>Orderd lits: ol tag, list the items by nymbering them</p>
    <ol>
        <li>Laptop</li>
        <li>Mobile</li>
        <li>Telivision</li>   
    </ol>
    
</body>
</html>
